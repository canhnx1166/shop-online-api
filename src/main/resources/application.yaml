spring:
  application:
    name: shop-online-api

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_online_db
    username: postgres
    password: Abc@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

#  jackson:
#    serialization:
#      WRITE_DATES_AS_TIMESTAMPS: false
server:
  servlet:
    context-path: /api
  port: 8080

logging:
  level:
    root: INFO
    com.example.shop: DEBUG
    org.hibernate.SQL: DEBUG